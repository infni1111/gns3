# Map Upgrade header for websocket passthrough
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name _;
    root /var/www/gns3-web-ui;
    index index.html;

    client_max_body_size 0;

    # Reverse-proxy the GNS3 REST API (v2 + future v3) and websockets
    # so the browser can talk to gns3-server on the same origin and
    # CORS never becomes a problem.
    location ~ ^/(v2|v3)/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
        proxy_buffering     off;
    }

    # SPA fallback for Angular router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
